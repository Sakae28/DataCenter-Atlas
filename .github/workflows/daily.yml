name: Daily digest

on:
  schedule:
    # 22:17 UTC daily = 06:17 Beijing time
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit updated data/news back to the repo
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline deps
        run: |
          python -m venv pipeline/.venv
          pipeline/.venv/bin/pip install -r pipeline/requirements.txt

      - name: Run news pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
        run: pipeline/.venv/bin/python pipeline/run.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/
          git diff --cached --quiet || git commit -m "data: daily digest $(date -u +%F)"
          git push

      - name: Build and deploy site
        uses: withastro/action@v3
        with:
          path: ./site
