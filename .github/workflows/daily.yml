name: Deploy site

# Data fetching is owned by two paths: the local scheduled task
# (pipeline/daily_run.bat via Windows Task Scheduler) as the primary, and
# the "Cloud daily digest" workflow (cloud-digest.yml) as the fallback when
# the local machine is off. Both commit data/ back to the repo; this
# workflow only builds and deploys the site on push (or on a dispatch from
# the cloud digest) — it never fetches news itself.
#
# Job structure follows the official Astro GitHub Pages guide
# (https://docs.astro.build/en/guides/deploy/github/): withastro/action only
# builds and uploads the artifact; actions/deploy-pages does the actual
# deployment. Repo Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install, build, and upload the site
        uses: withastro/action@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
