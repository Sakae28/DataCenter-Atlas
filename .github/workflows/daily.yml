name: Deploy site

# Plan A (2026-09-08): the local scheduled task (pipeline/daily_run.bat via
# Windows Task Scheduler) owns fetch + LLM processing (kimi CLI login lives
# on the user's machine) and commits data/ back to the repo. This workflow
# only builds and deploys the site on push — it no longer fetches news, so
# it needs neither the accelerator nor an LLM API key.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write      # deploy to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy site
        uses: withastro/action@v3
        with:
          path: ./site
