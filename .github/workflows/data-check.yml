# Data freshness check — runs daily at 03:00 UTC (after the local 09:00
# CST pipeline run has had time to push). If today's digest file is missing
# or empty, open a GitHub issue so the gap is visible instead of silent.
name: Data freshness check

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check today's digest
        id: check
        run: |
          today=$(date -u +%F)
          file="data/news/${today}.json"
          if [ ! -f "$file" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "detail=\`$file\` does not exist" >> "$GITHUB_OUTPUT"
          else
            count=$(python3 -c "import json;print(len(json.load(open('$file'))['stories']))")
            if [ "$count" -eq 0 ]; then
              echo "status=empty" >> "$GITHUB_OUTPUT"
              echo "detail=\`$file\` exists but contains 0 stories" >> "$GITHUB_OUTPUT"
            else
              echo "status=ok" >> "$GITHUB_OUTPUT"
              echo "detail=$count stories" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open issue on failure
        if: steps.check.outputs.status != 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const status = '${{ steps.check.outputs.status }}';
            const detail = `${{ steps.check.outputs.detail }}`;
            const title = `Daily digest ${status}: ${today}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-freshness',
            });
            if (open.some((i) => i.title === title)) {
              core.info('issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['data-freshness'],
              body: [
                `The daily news pipeline did not produce a usable digest for **${today}**.`,
                '',
                `Status: **${status}** — ${detail}.`,
                '',
                'Likely causes: local Task Scheduler run failed, accelerator off,',
                'or all sources unreachable. Check `pipeline/logs/daily.log` on the',
                'runner machine, then backfill with:',
                '',
                '```',
                `FETCH_MAX_AGE_HOURS=96 python pipeline/backfill_days.py ${today}`,
                '```',
              ].join('\n'),
            });
