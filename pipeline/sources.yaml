# Source registry for the APAC DC news pipeline.
# type: rss | google-news | html-list
# weight: relative source authority (1-3), used in heat calculation
# priority: P1 core media | P2 regional supplement | P0 first-hand (official)
# regions: regions this source mainly covers
# proxy: false = always fetch direct (mainland-China sites); unset = use
#        FETCH_PROXY / HTTP(S)_PROXY env when set.
# html-list: scrape a list/topic page for article links. Per-source keys:
#   link_pattern  regex over raw body, named groups (url) or (id) +
#                 optional (title)/(date); for lists embedded in JSON
#   url_template  build the article URL from the (id) group
#   item_selector / link_selector / url_pattern  DOM-mode container,
#                 anchor and href whitelist
#   date_selector element holding the date, or date_from: url +
#                 date_pattern (one capture group)
#   page_url / pages  optional pagination for archive-style sources:
#                 page_url carries a {page} placeholder, pages is the total
#                 page count including page 1
# html-list items often carry no date and stay on the page for days;
# run.py dedups them against a 7-day lookback instead of the usual 2.
#
# Curated 2026-08-26 per user list — the scatter-gun Google News keyword
# feeds were removed (too noisy, too many local-language items).
#
# Wired 2026-08-26 (previously "not wireable"):
#   ET Datacenters     — the telecom vertical's /rss/datacentres is an
#                        empty channel; the real source is the dedicated
#                        vertical datacenters.economictimes.indiatimes.com
#   The Business Times — official RSS works (rss.xml + section feeds);
#                        the Data Centres keyword page is JS-rendered, so
#                        its html-list entry parses the SSR JSON payload
#   AFR                — html-list on the Data centres topic page; heavy
#                        paywall, list-page metadata only
#   The Edge Malaysia  — html-list on the site's JSON search endpoint
#                        (no server-rendered search/tag page exists)
#   中国IDC圈           — old RSS paths (/plus/rss.php etc.) are 403/404;
#                        html-list on the news column. UTF-8, not GBK.
#                        Newsletter-only discovery (AFR/Edge) cannot be
#                        subscribed programmatically — not done.
#
# Still not wireable (no public RSS / blocked):
#   Baxtel News        — no RSS; needs an HTML scraper
#   Capacity Media     — RSS 403 (bot-blocked)
#   DealStreetAsia     — 503 / paywalled
#   DIGITIMES Asia     — RSS 403
# Nikkei Asia is only reachable through the local accelerator (set
# FETCH_PROXY or run with the accelerator on); it fails soft when it's off.

sources:
  # --- P1: core industry media ---
  - name: Data Center Dynamics
    type: rss
    url: https://www.datacenterdynamics.com/en/rss/
    weight: 3
    priority: P1
    regions: [global]

  - name: Data Center Dynamics — News archive
    type: html-list
    # RSS only carries ~2-3 days; the archive listing paginates back for
    # weeks, so a backfill after accelerator downtime loses nothing.
    url: https://www.datacenterdynamics.com/en/news/
    page_url: 'https://www.datacenterdynamics.com/en/news/?page={page}'
    pages: 3
    item_selector: article.card
    link_selector: a.headline-link
    url_pattern: '^https://www\.datacenterdynamics\.com/en/news/[a-z0-9-]+/$'
    date_selector: 'time[itemprop="datePublished"]'
    weight: 3
    priority: P1
    regions: [global]

  - name: W.Media
    type: rss
    url: https://w.media/feed/
    weight: 3
    priority: P1
    regions: [southeast-asia, china, japan, korea, australia]

  - name: DataCenterNews Asia
    type: rss
    url: https://datacentrenews.asia/feed/
    weight: 3
    priority: P1
    regions: [southeast-asia, australia, global]

  - name: Tech Wire Asia
    type: rss
    url: https://techwireasia.com/feed/
    weight: 2
    priority: P1
    regions: [southeast-asia, global]

  # --- P2: regional supplement ---
  - name: iTnews
    type: rss
    url: https://www.itnews.com.au/RSS/rss.ashx
    weight: 2
    priority: P2
    regions: [australia]

  - name: Nikkei Asia
    type: rss
    url: https://asia.nikkei.com/rss/feed/nar
    weight: 2
    priority: P2
    regions: [japan, global]

  - name: Nikkei Asia — data center search
    type: html-list
    # The RSS feed churns in under a day (high-volume general news); the
    # SSR search page (Next.js, sorted by recency) keeps older DC articles
    # reachable for backfills. Recent items show relative timestamps
    # ("11 hours ago") which don't parse — they stay dateless and are
    # handled by the 7-day cross-day dedup.
    url: 'https://asia.nikkei.com/search?query=data%20center'
    item_selector: 'article[class^="ArticleSearchResult_article"]'
    link_selector: 'a[data-trackable="headline"]'
    url_pattern: '^https://asia\.nikkei\.com/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+$'
    date_selector: 'span[data-trackable="timestamp"]'
    weight: 2
    priority: P2
    regions: [japan, global]

  - name: ET Datacenters
    type: rss
    url: https://datacenters.economictimes.indiatimes.com/rss/recentstories
    weight: 2
    priority: P2
    regions: [southeast-asia, global]

  - name: The Business Times
    type: rss
    url: https://www.businesstimes.com.sg/rss.xml
    weight: 2
    priority: P2
    regions: [southeast-asia]

  - name: The Business Times — Data Centres topic
    type: html-list
    url: https://www.businesstimes.com.sg/keywords/data-centres
    # Page is a client-rendered React Router app; the article list only
    # exists in the SSR turbo-stream payload, not in the DOM.
    turbo_stream: true
    url_pattern: '^https://www\.businesstimes\.com\.sg/[a-z0-9-]+/[a-z0-9-]+'
    weight: 2
    priority: P2
    regions: [southeast-asia]

  - name: AFR — Data Centres topic
    type: html-list
    url: https://www.afr.com/topic/data-centres-6hqb
    item_selector: '[data-pb-type="st"]'
    link_selector: 'a[data-testid="headlineLink"]'
    url_pattern: '^https://www\.afr\.com/[a-z0-9/-]+-\d{8}-[a-z0-9]+$'
    date_from: url
    date_pattern: '-(\d{8})-'
    weight: 2
    priority: P2
    regions: [australia]

  - name: The Edge Malaysia — data centre search
    type: html-list
    # No server-rendered tag/search page exists; this is the JSON endpoint
    # the site's own frontend search calls.
    url: 'https://webapi.theedgemalaysia.com/search?keywords=data+centre&limit=20'
    link_pattern: '"nid":\s*(?P<id>\d+)[^{}]*?"title":\s*"(?P<title>(?:[^"\\]|\\.)*)"[^{}]*?"created":\s*"(?P<date>[^"]*)"[^{}]*?"summary":\s*"(?P<snippet>(?:[^"\\]|\\.)*)"'
    url_template: 'https://theedgemalaysia.com/node/{id}'
    weight: 2
    priority: P2
    regions: [southeast-asia]

  - name: 中国IDC圈
    type: html-list
    url: https://www.idcquan.com/news/
    proxy: false  # mainland site — never through the accelerator
    item_selector: div.news
    link_selector: a.d1
    url_pattern: '\.shtml$'
    date_selector: span.date
    weight: 2
    priority: P2
    regions: [china]

  # --- P0: first-hand — company newsrooms & IR ---
  - name: Equinix (official)
    type: rss
    url: https://investor.equinix.com/rss/news-releases.xml
    weight: 3
    priority: P0
    regions: [global]

  - name: VNET Group (official)
    type: rss
    url: https://ir.vnet.com/rss/news-releases.xml
    weight: 3
    priority: P0
    regions: [china]

  - name: NTT DOCOMO BUSINESS (official)
    type: rss
    url: https://www.ntt.com/en/rss.xml
    weight: 3
    priority: P0
    regions: [japan]

  - name: Telehouse / KDDI (official)
    type: rss
    url: https://www.telehouse.com/feed
    weight: 3
    priority: P0
    regions: [japan]

  - name: AirTrunk (official)
    type: rss
    url: https://airtrunk.com/news/feed/
    weight: 3
    priority: P0
    regions: [australia, japan, southeast-asia]

  - name: Vantage Data Centers (official)
    type: rss
    url: https://vantage-dc.com/feed/?post_type=news
    weight: 3
    priority: P0
    regions: [china, japan, southeast-asia, australia]

  - name: Digital Edge (official)
    type: rss
    url: https://www.digitaledgedc.com/feed
    weight: 3
    priority: P0
    regions: [japan, korea, southeast-asia]

  - name: Princeton Digital Group (official)
    type: rss
    url: https://princetondg.com/feed/
    weight: 3
    priority: P0
    regions: [china, japan, southeast-asia]
